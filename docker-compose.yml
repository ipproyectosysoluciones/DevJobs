version: '3.8'

services:
  # ============================================
  # DevJobs Backend Application
  # ============================================
  devjobs:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: devjobs-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/devjobs
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-devjobs-secret-key-change-in-production}
      - JWT_EXPIRES_IN=24h
      - BUILDERBOT_URL=http://builderbot:3008
      - BUILDERBOT_API_KEY=${BUILDERBOT_API_KEY:-}
    volumes:
      - ./uploads:/app/uploads:rw
      - ./logs:/app/logs:rw
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - devjobs-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # MongoDB Database
  # ============================================
  mongodb:
    image: mongo:7
    container_name: devjobs-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-devjobs123}
      - MONGO_INITDB_DATABASE=devjobs
    volumes:
      - mongodb_data:/data/db
    networks:
      - devjobs-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================
  # Redis Cache & Sessions
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: devjobs-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - devjobs-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # BuilderBot Chat Service (WhatsApp + AI)
  # ============================================
  builderbot:
    build:
      context: ./builderbot
      dockerfile: Dockerfile
    container_name: devjobs-builderbot
    restart: unless-stopped
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=production
      - PORT=3008
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_PROJECT=${OPENAI_PROJECT:-}
      - MONGO_DB_URI=mongodb://admin:devjobs123@mongodb:27017/devjobs
      - MONGO_DB_NAME=builderbot
    volumes:
      - ./builderbot/sessions:/app/bot_sessions:rw
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - devjobs-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  devjobs-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local